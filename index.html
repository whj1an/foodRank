<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget：手机键盘弹出时把页面变矮，底部弹窗不会被键盘挡住 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#121212">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="锐评">
  <title>锐评</title>
  <!-- 手机「添加到主屏幕」用的图标和名字 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- 改了 style.css / app.js 以后，把 ?v= 后面的数字加 1，浏览器就不会用旧缓存 -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <!-- 还没配置数据库 -->
  <section id="setupView" class="setup" hidden>
    <h1 class="logo">锐评</h1>
    <p id="setupMsg" class="muted">还没有连接数据库。请按照 README.md 里的步骤，把 Supabase 的 URL 和 key 填进 config.js。</p>
  </section>

  <div id="appView" hidden>
    <!-- 顶部：标题 + 地区下拉；右边登录 / 注册 -->
    <header class="bar">
      <div class="brand">
        <button type="button" id="regionBtn" class="title-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="regionMenu">
          <span class="logo">锐评</span>
          <svg class="caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="region-name" id="regionName">Ottawa</span>
        </button>
        <div id="regionMenu" class="menu" role="menu" hidden>
          <button type="button" role="menuitemradio" data-region="ottawa">Ottawa</button>
          <button type="button" role="menuitemradio" data-region="toronto">Toronto</button>
        </div>
      </div>
      <button type="button" id="authBtn" class="ghost small-btn">登录 / 注册</button>
    </header>

    <!-- 搜索 + 方形添加按钮 -->
    <div class="searchrow">
      <label class="search">
        <input id="search" type="search" placeholder="搜索餐厅或细节" aria-label="搜索" enterkeyhint="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <!-- 输入了搜索词时，放大镜换成 ×，点一下清空 -->
        <button type="button" class="search-clear" id="searchClear" aria-label="清空搜索">×</button>
      </label>
      <button type="button" class="square-add" data-act="add" aria-label="添加餐厅">+</button>
    </div>

    <main class="wrap">
      <!-- 排序列表上方：阅览模式是「样式切换 + 编辑」，编辑模式是「完成 + 提示 + 取消」 -->
      <div class="list-head" id="listHead">
        <div class="view-only seg" id="styleSeg" role="radiogroup" aria-label="评级样式">
          <button type="button" data-style="tier" role="radio">夯拉</button>
          <button type="button" data-style="letter" role="radio">A–F</button>
          <button type="button" data-style="number" role="radio">1–10</button>
        </div>
        <span id="searchInfo" class="view-only muted small" aria-live="polite"></span>
        <button type="button" id="editBtn" class="view-only ghost small-btn member-only" hidden>编辑</button>

        <button type="button" id="doneBtn" class="edit-only primary small-btn">完成</button>
        <span class="edit-only muted small edit-tip">按住待评的餐厅，拖到对应的档</span>
        <button type="button" id="cancelEditBtn" class="edit-only ghost small-btn">取消</button>
      </div>

      <section class="board" id="board" aria-label="排行榜"></section>
      <section class="pool" id="pool" aria-label="待评"></section>
      <p class="meta muted small" id="stats"></p>
    </main>

    <!-- 底部固定横栏：主页 / 添加 / 账户 -->
    <nav class="tabbar" aria-label="导航">
      <button type="button" data-act="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>主页</span>
      </button>
      <button type="button" data-act="add" class="tab-add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>添加</span>
      </button>
      <button type="button" data-act="account">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>账户</span>
      </button>
    </nav>
  </div>

  <!-- 餐厅细节（阅览模式点标签弹出） -->
  <dialog id="detailDialog" class="sheet" aria-labelledby="detailName">
    <div id="detailBody"></div>
  </dialog>

  <!-- 添加 / 编辑餐厅：从下往上弹出 -->
  <dialog id="editDialog" class="sheet" aria-labelledby="editTitle">
    <form id="editForm" novalidate>
      <div class="sheet-head">
        <h2 id="editTitle">添加到 Ottawa</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </div>
      <label class="field">
        <span class="field-title">名称</span>
        <input name="name" maxlength="80" autocomplete="off" placeholder="比如 Shawarma Palace">
      </label>
      <div class="field">
        <span class="field-title">图片 <small class="muted">最多 3 张，第一张是封面</small></span>
        <div class="photos" id="photoSlots"></div>
        <input id="photoInput" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="field">
        <div class="field-row">
          <span class="field-title">细节</span>
          <button type="button" class="icon-btn add-detail" id="addDetailBtn" aria-label="添加一条细节">+</button>
        </div>
        <div id="detailFields"></div>
        <p class="muted small" id="detailEmpty">点右边的 + 写一条细节（每条最多 120 字）</p>
      </div>
      <div class="sheet-foot">
        <button type="submit" class="primary block" id="editSubmit">完成</button>
      </div>
    </form>
  </dialog>

  <!-- 登录 / 注册 -->
  <dialog id="authDialog" class="sheet" aria-labelledby="authTitle">
    <form id="authForm" novalidate>
      <div class="sheet-head">
        <h2 id="authTitle">登录</h2>
        <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
      </div>
      <p id="authLead" class="muted small" hidden></p>
      <div class="tabs" role="tablist">
        <button type="button" data-mode="login" class="active">登录</button>
        <button type="button" data-mode="signup">注册</button>
      </div>
      <label class="field">
        <span class="field-title">用户名<span class="signup-only muted small" hidden>（英文字母和数字，3–20 位）</span></span>
        <input name="username" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
        <span class="field-msg" data-for="username" aria-live="polite"></span>
      </label>
      <label class="field">
        <span class="field-title">密码<span class="muted small">（至少 6 位）</span></span>
        <input name="password" type="password" minlength="6" autocomplete="current-password">
      </label>
      <label class="field signup-only" hidden>
        <span class="field-title">确认密码</span>
        <input name="password2" type="password" minlength="6" autocomplete="new-password">
        <span class="field-msg" data-for="password2" aria-live="polite"></span>
      </label>
      <p id="authMsg" class="small field-msg" aria-live="polite"></p>
      <div class="sheet-foot">
        <button class="primary block" type="submit" id="authSubmit">登录</button>
      </div>
    </form>
  </dialog>

  <!-- 账户 -->
  <dialog id="accountDialog" class="sheet" aria-labelledby="accountName">
    <div id="accountBody"></div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="config.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
